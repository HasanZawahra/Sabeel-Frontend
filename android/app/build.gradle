apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply from: "../packages/flutter_tools/gradle/flutter.gradle"
apply plugin: 'kotlin-android'

android {
    namespace 'com.sabeel.app' // Replace with your actual package name
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.sabeel.app"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 1 // Replace with your actual version code
        versionName "1.0.0" // Replace with your actual version name
    }

    buildTypes {
        release {
            minifyEnabled true // Enable code shrinking
            shrinkResources true // Enable resource shrinking
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'com.google.firebase:firebase-analytics'
}
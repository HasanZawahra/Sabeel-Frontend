plugins {
    id 'com.android.application'
    id 'kotlin-android' // If you are using Kotlin
    id 'dev.flutter.flutter-gradle-plugin'
}

android {
    namespace = "com.example.sabeel"
    compileSdkVersion 34
    ndkVersion = "23.1.7779620" // Adjust this NDK version if necessary

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

defaultConfig {
    applicationId = "com.example.sabeel"
    minSdkVersion 21
    targetSdkVersion 34
    versionCode = project.hasProperty('flutterVersionCode') ? flutterVersionCode.toInteger() : 1
    versionName = project.hasProperty('flutterVersionName') ? flutterVersionName : "1.0.0"
}


    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}


plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
}

android {
    namespace = "com.sabeel.app"
    compileSdkVersion 35
    ndkVersion = "23.1.7779620" // Adjust this NDK version if necessary

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    defaultConfig {
        applicationId = "com.sabeel.app"
        minSdkVersion 23
        targetSdkVersion 35
        versionCode = project.hasProperty('flutterVersionCode') ? flutterVersionCode.toInteger() : 1
        versionName = project.hasProperty('flutterVersionName') ? flutterVersionName : "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled true // Enable code shrinking
            shrinkResources true // Enable resource shrinking
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'com.google.firebase:firebase-analytics'
}
